name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.13"]
        exclude:
          - os: macos-latest  # no Python 3.8 build for arm64 macOS runners
            python: "3.8"
        include:
          - os: macos-latest
            python: "3.9"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Versions
        run: |
          python --version
          git --version
          uname -a

      - name: Install test dependencies
        run: python -m pip install pytest cryptography

      - name: Tests
        run: python -m pytest -q -p no:asyncio

      - name: Smoke test the zero-install launchers (bin/ on PATH)
        run: sh packaging/smoke.sh bin

      - name: Smoke test install.sh into a temp HOME
        run: |
          home=$(mktemp -d)
          HOME="$home" sh install.sh
          "$home/.local/bin/iron" --version
          test -x "$home/.local/bin/git-remote-iron"
