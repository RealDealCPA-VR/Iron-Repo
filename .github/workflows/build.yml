name: Standalone executables

on:
  push:
    branches: [ci/portability]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: macos-arm64
            os: macos-latest
          - target: linux-x64
            os: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install pyinstaller cryptography

      - name: Build
        run: python packaging/build.py

      - name: Smoke test the executables
        run: sh packaging/smoke.sh dist/standalone

      # Artifacts are zipped without Unix permissions, so macOS/Linux builds travel as a
      # tarball that keeps the executable bit.
      - name: Package
        run: |
          mkdir -p dist/upload
          if [ "$RUNNER_OS" = Windows ]; then
            cp dist/standalone/* dist/upload/
          else
            tar -czf "dist/upload/iron-${{ matrix.target }}.tar.gz" -C dist/standalone iron git-remote-iron
          fi
          ls -l dist/standalone dist/upload

      - uses: actions/upload-artifact@v4
        with:
          name: iron-${{ matrix.target }}
          path: dist/upload/
          if-no-files-found: error
